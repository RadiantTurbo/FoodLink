name: Build FOODLINK Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.foodlink build_app

      - name: Copy FOODLINK source
        run: |
          cp -r lib build_app/
          cp pubspec.yaml build_app/

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodlink-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
